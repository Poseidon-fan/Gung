[workspace]
members = ["server", "client", "components/*"]
exclude = ["pylib"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Poseidon <18646154381@163.com>"]
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.5"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
pyo3 = { version = "0.26.0", features = ["auto-initialize", "serde"] }
pythonize = "0.26.0"
async-trait = "0.1.89"
semver = "1.0.27"
uuid = { version = "1.18.1", features = ["v4"] }
rustls = { version = "0.23.5", default-features = false, features = ["std"] }
quinn = "0.11.9"
directories-next = "2"
rcgen = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
net-mux = { git = "https://github.com/Poseidon-fan/net-mux" }
rustls-native-certs = "0.8.1"
rand_set = "0.1.2"
parking_lot = "0.12.5"
tokio-util = { version = "0.7.16", features = ["codec"] }
futures-util = "0.3.31"
strum = { version = "0.27.2", features = ["derive"] }
bincode = "2.0.1"
atty = "0.2.14"
