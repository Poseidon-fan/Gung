name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    permissions:
      contents: write
    name: Build for ${{ matrix.platform.target }}-python-${{ matrix.python }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        platform:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }


    steps:
      - uses: actions/checkout@v5
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          default: true

      # Setup Python environment
      - name: Setup Python
        if: matrix.python != 'none'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Build
      - name: Install target
        run: rustup target add ${{ matrix.platform.target }}
      - name: Build release
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Run UPX
        continue-on-error: true
        if: matrix.platform.os == 'ubuntu-latest'
        uses: crazy-max/ghaction-upx@v1
        with:
          version: v4.0.2
          files: |
            target/${{ matrix.platform.target }}/release/gungs${{ matrix.platform.os == 'windows-latest' && '.exe' || '' }}
            target/${{ matrix.platform.target }}/release/gungc${{ matrix.platform.os == 'windows-latest' && '.exe' || '' }}
          args: -q --best --lzma

      - uses: actions/upload-artifact@v4
        with:
          name: gung-${{ matrix.platform.target }}-python-${{ matrix.python }}
          path: |
            target/${{ matrix.platform.target }}/release/gungs${{ matrix.platform.os == 'windows-latest' && '.exe' || '' }}
            target/${{ matrix.target }}/release/gungc${{ matrix.os == 'windows-latest' && '.exe' || '' }}

      - name: Zip Release
        uses: TheDoctor0/zip-release@0.6.1
        with:
          type: zip
          filename: gung-${{ matrix.platform.target }}-python-${{ matrix.python }}.zip
          directory: target/${{ matrix.platform.target }}/release/
          path: |
            gungs${{ matrix.platform.os == 'windows-latest' && '.exe' || '' }}
            gungc${{ matrix.platform.os == 'windows-latest' && '.exe' || '' }}

      - name: Publish
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/${{ matrix.platform.target }}/release/gung-${{ matrix.platform.target }}-python-${{ matrix.python }}.zip
          generate_release_notes: true
          draft: true
